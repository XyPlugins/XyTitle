settings:
  # owned-all：玩家已拥有的所有称号属性累加，兼容旧插件逻辑。
  # equipped-only：只计算当前佩戴称号属性。
  attribute-mode: owned-all
  attribute-source-prefix: "xytitle"
  timed-check-ticks: 1200
  save-on-change: true

display:
  # 是否在普通 Bukkit 聊天事件中追加称号前缀。
  # 如果你已经使用 XyChatPlus 接管聊天，建议关闭这里，改用聊天格式中的 %xytitle_title%。
  chat-prefix-enabled: true
  chat-prefix: "&f[&6{title}&f] "

  # 是否把称号写进 Bukkit 玩家显示名。
  # 开启后，/gamemode、死亡提示、部分系统提示或其他插件读取玩家显示名时也会带称号。
  # 关闭后，这些地方只显示玩家原名；推荐保持 false。
  player-display-name-prefix-enabled: false

  # 是否在 Tab 列表显示称号。
  tab-prefix-enabled: true
  tab-prefix: "&6{title} &f{player}"

  # 玩家没有佩戴称号时显示的空称号文本。
  no-title: ""

gui:
  main-menu-size: 9
  title-storage-size: 54
  storage-items-per-page: 45

messages:
  # 兼容旧配置保留；玩家聊天提示实际优先使用 XyCore config.yml -> messages.prefix。
  prefix: "&6[XyTitle] &r"
  no-permission: "&c权限不足。"
  players-only: "&c该命令只能由玩家执行。"
  reloaded: "&a配置已重载。"
  title-not-found: "&c称号不存在: &f{title}"
  player-not-found: "&c玩家不在线: &f{player}"
  granted: "&a已给予 &f{player} &a称号 &f{title}&a。"
  received: "&a你获得了新称号: &f{title}"
  self-received: "&a你已直接获取称号: &f{title}"
  taken: "&a已移除 &f{player} &a的称号 &f{title}&a。"
  cleared: "&a已清空 &f{player} &a的所有称号。"
  equipped: "&a已佩戴称号: &f{title}"
  unequipped: "&a已取消佩戴称号。"
  not-owned: "&c你尚未拥有该称号。"
  expired: "&c你的限时称号 &f{title} &c已过期。"
  attribute-updated: "&7称号属性已刷新。"
  help:
    - "&6/xych open &7- 打开称号仓库"
    - "&6/xych get <称号> &7- 直接获取称号，支持ID或显示名，需要 xytitle.get"
    - "&6/xych equip <称号> &7- 佩戴称号"
    - "&6/xych unequip &7- 取消佩戴"
    - "&6/xych attributes &7- 查看当前称号属性"
    - "&6/xych list &7- 查看称号列表"
    - "&6/xych give <玩家> <称号> [时长] &7- 管理员给予称号"
    - "&6/xych take <玩家> <称号> &7- 管理员移除称号"
    - "&6/xych clear <玩家> &7- 管理员清空称号"
    - "&6/xych reload &7- 重载插件"

# 普通称号已移动到 titles.yml。
# 成长称号继续使用 growth_titles.yml。
# 旧版 config.yml 中的 titles: 会在 titles.yml 不存在时自动迁移。
