settings:
  # owned-all: 玩家已拥有的所有称号属性累加，兼容原插件逻辑。
  # equipped-only: 只计算当前佩戴称号属性。
  attribute-mode: owned-all
  attribute-source-prefix: "xytitle"
  timed-check-ticks: 1200
  save-on-change: true

display:
  chat-prefix-enabled: true
  chat-prefix: "&f[&6{title}&f] "
  tab-prefix-enabled: true
  tab-prefix: "&6{title} &f{player}"
  no-title: ""

gui:
  main-menu-size: 9
  title-storage-size: 54
  storage-items-per-page: 45

messages:
  prefix: "&6[XyTitle] &r"
  no-permission: "&c权限不足。"
  players-only: "&c该命令只能由玩家执行。"
  reloaded: "&a配置已重载。"
  title-not-found: "&c称号不存在: &f{title}"
  player-not-found: "&c玩家不在线: &f{player}"
  granted: "&a已给予 &f{player} &a称号 &f{title}&a。"
  received: "&a你获得了新称号: &f{title}"
  taken: "&a已移除 &f{player} &a的称号 &f{title}&a。"
  cleared: "&a已清空 &f{player} &a的所有称号。"
  equipped: "&a已佩戴称号: &f{title}"
  unequipped: "&a已取消佩戴称号。"
  not-owned: "&c你尚未拥有该称号。"
  expired: "&c你的限时称号 &f{title} &c已过期。"
  attribute-updated: "&7称号属性已刷新。"
  help:
    - "&6/xytitle open &7- 打开称号仓库"
    - "&6/xytitle equip <称号> &7- 佩戴称号"
    - "&6/xytitle unequip &7- 取消佩戴"
    - "&6/xytitle attributes &7- 查看当前称号属性"
    - "&6/xytitle give <玩家> <称号> [时长] &7- 给予称号"
    - "&6/xytitle take <玩家> <称号> &7- 移除称号"
    - "&6/xytitle clear <玩家> &7- 清空称号"
    - "&6/xytitle reload &7- 重载插件"

titles:
  newbie:
    display-name: "&a新手称号"
    item-material: "PAPER"
    lore:
      - "&7新手专属称号"
      - "&6生命上限: +200"
      - "&6攻击力: +50"
      - "&6暴击几率: +5%"
      - "&6暴击伤害: +20%"
    attributes:
      生命上限: 200
      攻击力: 50
      暴击几率: "5%"
      暴击伤害: "20%"

  first_charge:
    display-name: "&a6元首充称号"
    item-material: "PAPER"
    lore:
      - "&76元首充专属称号"
      - "&6生命上限: +3000"
      - "&6攻击力: +800"
      - "&6暴击几率: +8%"
      - "&4饮血几率: +5%"
