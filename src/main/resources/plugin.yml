name: XyTitle
version: '1.0.6'
main: org.xyplugin.xytitle.XyTitlePlugin
api-version: '1.12'
author: XyPlugin
description: Xy series title storage and attribute title plugin.
depend: [XyCore]
softdepend: [PlaceholderAPI]

commands:
  xytitle:
    description: XyTitle main command
    usage: /xytitle <open|get|equip|unequip|give|take|clear|list|attributes|reload|help>
    aliases: [xych, xyt, title]

permissions:
  xytitle.use:
    description: Allows players to use XyTitle.
    default: true
  xytitle.admin:
    description: Allows administrators to manage player titles.
    default: op
  xytitle.get:
    description: Allows players to directly obtain configured titles for testing or controlled rewards.
    default: op
  xytitle.reload:
    description: Allows administrators to reload XyTitle.
    default: op
